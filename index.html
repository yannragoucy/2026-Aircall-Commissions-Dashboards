<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f4f0;
  --bg2: #eceae4;
  --white: #ffffff;
  --border: #dedad2;
  --border2: #ccc9c0;
  --text: #1a1916;
  --text2: #5a574f;
  --text3: #9c9890;
  --blue: #1d6fce;
  --blue-bg: #e8f0fb;
  --green: #1a7a4a;
  --green-bg: #e6f4ec;
  --amber: #b45309;
  --amber-bg: #fef3e2;
  --red: #c0392b;
  --red-bg: #fdecea;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 14px; }

/* ── HEADER ── */
header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 200;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon { width: 32px; height: 32px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; flex-shrink: 0; }
header h1 { font-size: 15px; font-weight: 600; }
header p { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 1px; }
.month-chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.month-chip { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg); color: var(--text2); font-size: 11px; font-family: var(--mono); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.month-chip:hover { border-color: var(--blue); color: var(--blue); }
.month-chip.active { background: var(--blue); color: white; border-color: var(--blue); }
.month-chip.del { color: var(--red); border-color: #ecc; padding: 4px 7px; background: var(--white); }
.month-chip.del:hover { background: var(--red); color: white; border-color: var(--red); }
.fx-note { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 4px; }

/* ── UPLOAD ── */
.upload-zone { margin: 16px 28px; border: 1.5px dashed var(--border2); border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; background: var(--white); transition: all 0.2s; }
.upload-zone:hover, .upload-zone.over { border-color: var(--blue); background: var(--blue-bg); }
.upload-zone input { display: none; }
.upload-zone h3 { font-size: 13px; font-weight: 600; margin-top: 5px; }
.upload-zone p { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 3px; }

/* ── TOP-LEVEL TABS (plan + raw data) ── */
.plan-tabs-bar { border-bottom: 1px solid var(--border); padding: 0 28px; background: var(--white); display: flex; gap: 0; overflow-x: auto; }
.plan-tab { padding: 12px 20px; border: none; background: none; color: var(--text3); font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.2px; }
.plan-tab:hover { color: var(--text2); }
.plan-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.plan-tab.rawdata-tab { color: var(--text3); border-left: 1px solid var(--border); margin-left: 8px; padding-left: 22px; }
.plan-tab.rawdata-tab.active { color: var(--amber); border-bottom-color: var(--amber); }

/* ── PLAN CONTENT ── */
.plan-content { display: none; padding: 22px 28px; }
.plan-content.active { display: block; }

/* ── KPI ROW ── */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.kpi label { font-size: 10px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
.kpi .val { font-size: 22px; font-weight: 700; margin-top: 3px; }
.kpi .sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ── SECTIONS ── */
.section { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); margin-bottom: 12px; }
.chart-wrap { position: relative; }
.chart-wrap.h300 { height: 300px; }
.chart-wrap.h320 { height: 320px; }
.chart-wrap.h260 { height: 260px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

.legend-row { display: flex; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); font-family: var(--mono); }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; }
.leg-dashed { width: 16px; height: 2px; background: repeating-linear-gradient(to right, #999 0, #999 4px, transparent 4px, transparent 8px); }

/* ── SUB-TABS ── */
.sub-tabs-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.sub-tab { padding: 8px 16px; border: none; background: none; cursor: pointer; font-size: 12px; font-family: var(--mono); color: var(--text3); border-bottom: 2px solid transparent; transition: all 0.15s; }
.sub-tab:hover { color: var(--text); }
.sub-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.sub-panel { display: none; }
.sub-panel.active { display: block; }

/* ── RAW DATA TABLE ── */
#raw-panel { display: none; padding: 22px 28px; }
#raw-panel.active { display: block; }

.raw-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.raw-filters label { font-size: 11px; font-family: var(--mono); color: var(--text3); }
.raw-select { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border: 1px solid var(--border2); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
.raw-select:focus { outline: none; border-color: var(--blue); }
.raw-search { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border: 1px solid var(--border2); border-radius: 6px; background: var(--bg); color: var(--text); width: 200px; }
.raw-search:focus { outline: none; border-color: var(--blue); }
.raw-count { font-size: 11px; font-family: var(--mono); color: var(--text3); margin-left: auto; }

.table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 600px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
thead { position: sticky; top: 0; z-index: 10; }
th { background: var(--bg2); padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 600; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
th .sort-icon { opacity: 0.4; margin-left: 4px; }
th.sorted .sort-icon { opacity: 1; color: var(--blue); }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9f8f5; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: var(--mono); font-weight: 500; }
.badge-blue { background: var(--blue-bg); color: var(--blue); }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-amber { background: var(--amber-bg); color: var(--amber); }
.att-cell { font-family: var(--mono); font-weight: 500; }
.att-green { color: var(--green); }
.att-amber { color: var(--amber); }
.att-red { color: var(--red); }

/* ── TOAST ── */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 8px; padding: 11px 16px; font-size: 12px; font-family: var(--mono); box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(60px); opacity: 0; transition: all 0.3s; z-index: 999; }
.toast.show { transform: none; opacity: 1; }
.toast.err { border-left-color: var(--red); }

/* ── MONTH SELECTOR BAR (inside plan panel, Monthly view) ── */
.month-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0 14px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.month-bar-label { font-size:10px; color:var(--text3); font-family:var(--mono); white-space:nowrap; }
.mchip { padding:3px 11px; border-radius:20px; border:1px solid var(--border2); background:var(--bg); color:var(--text2); font-size:11px; font-family:var(--mono); cursor:pointer; transition:all .15s; white-space:nowrap; }
.mchip:hover { border-color:var(--blue); color:var(--blue); }
.mchip.active { background:var(--blue); color:white; border-color:var(--blue); }

/* ── YTD PANEL ── */
.ytd-section { background:var(--white); border:1px solid var(--border); border-radius:8px; padding:18px 20px; margin-bottom:16px; }
.ytd-comp-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:14px; }
.ytd-comp-tab { padding:7px 14px; border:none; background:none; cursor:pointer; font-size:11px; font-family:var(--mono); color:var(--text3); border-bottom:2px solid transparent; transition:all .15s; }
.ytd-comp-tab:hover { color:var(--text); }
.ytd-comp-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.ytd-comp-panel { display:none; }
.ytd-comp-panel.active { display:block; }
.ytd-filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.ytd-filter-bar label { font-size:10px; font-family:var(--mono); color:var(--text3); }
.ytd-chip { padding:3px 11px; border-radius:20px; border:1px solid var(--border2); background:var(--white); color:var(--text2); font-size:11px; font-family:var(--mono); cursor:pointer; transition:all .15s; }
.ytd-chip:hover { border-color:var(--blue); color:var(--blue); }
.ytd-chip.active { background:var(--blue); color:white; border-color:var(--blue); }
.ytd-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.ytd-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:16px; }
.ytd-level-section { margin-top:16px; }
.ytd-level-filters { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.ytd-level-filters label { font-size:11px; font-family:var(--mono); color:var(--text3); }
.ytd-level-filters select { font-family:var(--mono); font-size:11px; padding:4px 8px; border:1px solid var(--border2); border-radius:6px; background:var(--bg); color:var(--text); cursor:pointer; }
.ytd-level-filters select:focus { outline:none; border-color:var(--blue); }
.ytd-level-filters .sep { font-size:10px; color:var(--text3); font-family:var(--mono); }
.ytd-no-data { text-align:center; padding:40px; color:var(--text3); font-family:var(--mono); font-size:12px; }

/* ── VIEW TOGGLE (Monthly / Quarterly / YTD) ── */
.view-toggle { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:16px; }
.view-btn { padding:10px 18px; border:none; background:none; cursor:pointer; font-size:12px; font-family:var(--sans); font-weight:600; color:var(--text3); border-bottom:2px solid transparent; transition:all .15s; }
.view-btn:hover { color:var(--text2); }
.view-btn.active { color:var(--blue); border-bottom-color:var(--blue); }

/* ── QUARTERLY PANEL ── */
.qtr-section { background:var(--white); border:1px solid var(--border); border-radius:8px; padding:18px 20px; margin-bottom:16px; }
.qtr-filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.qtr-filter-bar .section-title { margin-bottom:0; }
.qtr-chip { padding:4px 13px; border-radius:20px; border:1px solid var(--border2); background:var(--white); color:var(--text2); font-size:11px; font-family:var(--mono); cursor:pointer; transition:all .15s; white-space:nowrap; }
.qtr-chip:hover { border-color:var(--blue); color:var(--blue); }
.qtr-chip.active { color:white; border-color:transparent; background:#888; }
.qtr-chip.qc1.active { background:#1d6fce; }
.qtr-chip.qc2.active { background:#1a7a4a; }
.qtr-chip.qc3.active { background:#b45309; }
.qtr-chip.qc4.active { background:#7c3aed; }
.qtr-comp-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:14px; }
.qtr-comp-tab { padding:7px 14px; border:none; background:none; cursor:pointer; font-size:11px; font-family:var(--mono); color:var(--text3); border-bottom:2px solid transparent; transition:all .15s; }
.qtr-comp-tab:hover { color:var(--text); }
.qtr-comp-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.qtr-comp-panel { display:none; }
.qtr-comp-panel.active { display:block; }
.qtr-two-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:16px; }
.qtr-no-data { text-align:center; padding:48px 20px; color:var(--text3); font-family:var(--mono); font-size:12px; }

/* ── COMMENT BOX ── */
.comment-box { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
.comment-box-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
.comment-box-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); display: flex; align-items: center; gap: 7px; }
.comment-box-title svg { opacity: 0.5; }
.comment-saved { font-size: 10px; font-family: var(--mono); color: var(--green); opacity: 0; transition: opacity 0.3s; }
.comment-saved.show { opacity: 1; }
.comment-textarea {
  width: 100%; min-height: 80px; max-height: 300px;
  font-family: var(--sans); font-size: 13px; color: var(--text); line-height: 1.6;
  border: 1px solid var(--border2); border-radius: 6px; padding: 10px 12px;
  background: var(--bg); resize: vertical; transition: border-color 0.15s;
  outline: none;
}
.comment-textarea:focus { border-color: var(--blue); background: var(--white); }
.comment-textarea::placeholder { color: var(--text3); font-style: italic; }

/* ── EDITABLE RAW CELLS ── */
td.editable { cursor: pointer; }
td.editable:hover { background: var(--blue-bg) !important; }
td.editable input {
  font-family: var(--mono); font-size: 12px; color: var(--text);
  border: 1px solid var(--blue); border-radius: 4px; padding: 2px 6px;
  background: var(--white); width: 100%; outline: none;
}
.raw-saving { font-size: 10px; font-family: var(--mono); color: var(--green); margin-left: auto; opacity: 0; transition: opacity 0.3s; }
.raw-saving.show { opacity: 1; }

/* ── QUARTERLY NOTES ── */
.qtr-note-box { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-top: 16px; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 768px) {
  header, .upload-zone, .plan-tabs-bar, .plan-content, #raw-panel { padding-left: 16px; padding-right: 16px; }
  .two-col { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">◈</div>
    <div>
      <h1>Commission Dashboard</h1>
      <p id="hdr-sub">No data — upload a CaptivateIQ CSV to begin</p>
    </div>
  </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:10px;color:var(--text3);font-family:var(--mono)">Stored months:</span>
          <div class="month-chips" id="stored-months"></div>
        </div>
      </div>
      <div class="fx-note" id="fx-note"></div>
    </div>
</header>

<div class="upload-zone" id="upload-zone">
  <input type="file" id="file-input" accept=".csv">
  <div style="font-size:22px">📥</div>
  <h3>Drop a CaptivateIQ payout CSV here</h3>
  <p>Data stored in browser · FX rates from official CIQ table</p>
</div>

<div class="plan-tabs-bar" id="plan-tabs"></div>
<div id="plan-panels"></div>
<div id="raw-panel"></div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// FX RATES — from official CIQ table (2026, all months identical)
// ═══════════════════════════════════════════════════
const FX_TABLE = {
  "January 2026":   { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "February 2026":  { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "March 2026":     { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "April 2026":     { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "May 2026":       { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "June 2026":      { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "July 2026":      { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "August 2026":    { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "September 2026": { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "October 2026":   { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "November 2026":  { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 },
  "December 2026":  { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 }
};
const FX_FALLBACK = { USD:1, EUR:1.16, GBP:1.33, AUD:0.66, MXN:0.05 };

function getFX(monthLabel, currency) {
  const rates = FX_TABLE[monthLabel] || FX_FALLBACK;
  return rates[currency] || 1;
}

// ═══════════════════════════════════════════════════
// STORAGE — Supabase primary, EMBEDDED_DATA as seed
// ═══════════════════════════════════════════════════
const STORE_KEY = 'ciq_dash_v4';

// In-memory store (populated from Supabase + EMBEDDED_DATA)
let _store = null;

async function initStore() {
  if (_store) return _store;
  // Start with embedded data as base
  _store = { ...(EMBEDDED_DATA || {}) };
  try {
    const res = await fetch(`${SB_MONTHLY}?select=month,data`, { headers: SB_HDR });
    const rows = await res.json();
    if (Array.isArray(rows)) {
      rows.forEach(r => {
        // Supabase data takes precedence over embedded
        try { _store[r.month] = typeof r.data === 'string' ? JSON.parse(r.data) : r.data; }
        catch(e) { console.warn('parse error for', r.month, e); }
      });
    }
  } catch(e) { console.warn('Supabase monthly load failed:', e); }
  return _store;
}

function loadStore() {
  // Synchronous fallback — returns current in-memory store or embedded
  return _store || EMBEDDED_DATA || {};
}

async function saveMonthToSupabase(monthLabel, data) {
  // Upsert: PATCH if exists, POST if not
  try {
    const check = await fetch(`${SB_MONTHLY}?month=eq.${encodeURIComponent(monthLabel)}&select=month`, { headers: SB_HDR });
    const exists = await check.json();
    const body = JSON.stringify({ month: monthLabel, data: JSON.stringify(data), updated_at: new Date().toISOString() });
    if (exists?.length > 0) {
      await fetch(`${SB_MONTHLY}?month=eq.${encodeURIComponent(monthLabel)}`, {
        method: 'PATCH', headers: { ...SB_HDR, 'Prefer': 'return=minimal' }, body
      });
    } else {
      await fetch(SB_MONTHLY, {
        method: 'POST', headers: { ...SB_HDR, 'Prefer': 'return=minimal' }, body
      });
    }
  } catch(e) { console.warn('saveMonthToSupabase failed:', e); }
}

async function deleteMonthFromSupabase(monthLabel) {
  try {
    await fetch(`${SB_MONTHLY}?month=eq.${encodeURIComponent(monthLabel)}`, {
      method: 'DELETE', headers: SB_HDR
    });
  } catch(e) { console.warn('deleteMonth failed:', e); }
}

function sortedKeys(store, asc=true) {
  return Object.keys(store).sort((a, b) => {
    const da = new Date(a), db = new Date(b);
    const ta = isNaN(da) ? a : da.getTime();
    const tb = isNaN(db) ? b : db.getTime();
    return asc ? ta - tb : tb - ta;
  });
}

function parseCSV(text) {
  const rows = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
  if (!rows.length) throw new Error('Empty CSV');

  const mRaw = rows.find(r => r['Payout Month'])?.['Payout Month'] || '';
  let monthLabel = 'Unknown';
  if (mRaw) {
    const d = new Date(mRaw);
    monthLabel = isNaN(d) ? mRaw : d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }

  const plans = {};
  const rawRows = [];

  rows.forEach(r => {
    // Quarter: use Payout Quarter column if present, else derive from Payout Month date
    let quarterLabel = (r['Payout Quarter'] || '').trim();
    if (!quarterLabel) {
      const mRaw2 = (r['Payout Month'] || '').trim();
      if (mRaw2) {
        const md = new Date(mRaw2);
        if (!isNaN(md)) {
          const qNum = Math.ceil((md.getMonth() + 1) / 3);
          quarterLabel = `Q${qNum} ${md.getFullYear()}`;
        }
      }
    }
    if (!quarterLabel) quarterLabel = monthLabel ? `Q${Math.ceil((new Date(monthLabel+' 1').getMonth()+1)/3)} ${new Date(monthLabel+' 1').getFullYear()}` : 'Unknown';
    // Final fallback: derive from the parsed monthLabel
    if (quarterLabel === 'Unknown' && monthLabel !== 'Unknown') {
      const md2 = new Date(monthLabel);
      if (!isNaN(md2)) quarterLabel = `Q${Math.ceil((md2.getMonth()+1)/3)} ${md2.getFullYear()}`;
    }
    const plan = (r['Current Plan Name'] || r['Original Plan Name'] || '').trim();
    if (!plan) return;
    if (!plans[plan]) plans[plan] = [];

    const currency = r['Employee Payout Currency'] || 'USD';
    const fx = getFX(monthLabel, currency);
    const n = v => { const f = parseFloat(v); return isNaN(f) ? 0 : f; };
    const nfx = v => n(v) * fx;

    const fn = (r['Employee First Name'] || '').trim();
    const ln = (r['Employee Last Name'] || '').trim();
    const name = (fn + ' ' + ln).trim() || 'N/A';

    let oteRaw = plan === 'xDR Management' ? n(r['Payout Full OTE']) : n(r['Payout OTE']);
    const ote    = oteRaw * fx;
    const payout = nfx(r['Payout Payout']);

    const area  = (r['Employee Area'] || r['Payout Area'] || '').trim() || 'Unknown';
    let level = '';
    if (plan === 'AE Plan' || plan === 'AE Manager/Director') {
      level = (r['Payout AE Level'] || '').trim() || 'Unknown';
    } else {
      const lv = n(r['Payout Level']);
      level = lv ? 'Level ' + lv : 'Unknown';
    }

    const comp = {};
    if (plan === 'AE Plan' || plan === 'AE Manager/Director') {
      comp.mrr_actual   = nfx(r['Payout Monthly Additional MRR']);
      comp.mrr_quota    = nfx(r['Payout Effective Monthly Quota']);
      comp.addons_actual = nfx(r['Payout Add-ons Signed']);
      comp.addons_quota  = nfx(r['Payout Add-ons quota']);
    }
    if (plan === 'BDR Plan') {
      comp.dp_actual   = n(r['Payout Demo Points - Monthly Achivement']);
      comp.dp_target   = n(r['Payout Demo Points - Target']);
      comp.closing_usd = nfx(r['Payout Closing $ (from Payout M-3)']);
    }

      comp.qp_payout = nfx(r['Payout Payout - Qualified Pipeline']);
      comp.qp_target = nfx(r['Payout Target - Qualified Pipeline']);
    }
    if (plan === 'xDR Management') {
      comp.bdr_qp_ach = n(r['Payout BDR QP Achievement']);
      comp.bdr_qp_tgt = n(r['Payout BDR QP Target']);
      comp.bdr_cl_ach = n(r['Payout BDR Closing Achievement']);
      comp.bdr_cl_tgt = n(r['Payout BDR Closing Target']);
    }

    const person = { name, area, level, ote, payout, currency, fx, comp, quarter: quarterLabel };
    plans[plan].push(person);

    // Raw data row
    const attainment = ote > 0 ? payout / ote : null;
    rawRows.push({
      month: monthLabel,
      plan,
      name,
      area,
      level,
      currency,
      fx,
      ote_local: oteRaw,
      ote_usd: ote,
      payout_local: n(plan === 'xDR Management' ? r['Payout Payout'] : r['Payout Payout']),
      payout_usd: payout,
      attainment,
      email: r['Employee Email'] || ''
    });
  });

  return { monthLabel, plans, rawRows };
}

function renderScatter(canvasId, people, monthLabel, plan) {
  destroyChart(canvasId);

  if (!ctx) return;
  // Apply overrides
  const ep = people.map(p => {
    const ov = rawOverrides[`${monthLabel||activeMonth}||${p.name}||${plan||''}`] || {};
    return { ...p,
      ote:    ov.ote_usd    != null ? parseFloat(ov.ote_usd)    : p.ote,
      payout: ov.payout_usd != null ? parseFloat(ov.payout_usd) : p.payout,
    };
  });
  // include everyone with a valid OTE (even if payout = 0)
  const valid = ep.filter(p => p.ote > 0);
  const maxVal = Math.max(...valid.map(p => Math.max(p.ote, p.payout)), 1) * 1.15;
  charts[canvasId] = new Chart(ctx, {

        borderColor:'rgba(29,111,206,0.35)', borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{...TT, callbacks:{

      }}},

function getAttainment(person, plan, subId) {
  const c = person.comp;
  // null = truly no data for this component → excluded from chart
  // 0   = valid 0% attainment → shown as 0%
  if (subId==='overall') {
    // If OTE=0 but person is in the plan, show 0% rather than excluding them
    if (person.ote === 0) return person.payout > 0 ? null : 0;
    return (person.payout / person.ote) * 100;
  }
  if (subId==='mrr')      return c.mrr_quota>0 ? (c.mrr_actual/c.mrr_quota)*100 : (c.mrr_actual===0 ? 0 : null);
  if (subId==='addons')   return c.addons_quota>0 ? (c.addons_actual/c.addons_quota)*100 : (c.addons_actual===0 ? 0 : null);
  if (subId==='dp')       return c.dp_target>0 ? (c.dp_actual/c.dp_target)*100 : (c.dp_actual===0 ? 0 : null);
  if (subId==='closing')  return c.closing_usd != null ? c.closing_usd : null;
  if (subId==='qp')       return c.qp_target>0 ? (c.qp_payout/c.qp_target)*100 : (c.qp_payout===0 ? 0 : null);
  if (subId==='bdrqp')    return c.bdr_qp_tgt>0 ? (c.bdr_qp_ach/c.bdr_qp_tgt)*100 : null;
  if (subId==='bdrcl')    return c.bdr_cl_tgt>0 ? (c.bdr_cl_ach/c.bdr_cl_tgt)*100 : null;
  return null;
}

function groupAvg(arr, keyFn, attFn) {
  const m = {};
  arr.forEach(p => {
    const k = keyFn(p); if (!m[k]) m[k] = [];
    const a = attFn(p);
    // include 0% — only skip null (no valid denominator) and non-finite
    if (a !== null && isFinite(a)) m[k].push(a);
  });
  return Object.entries(m)
    .map(([k,vs]) => ({ key:k, avg:vs.length ? vs.reduce((s,v)=>s+v,0)/vs.length : 0, n:vs.length }))
    .filter(g => g.n > 0)
    .sort((a,b) => b.avg-a.avg);
}

let rawSortCol = 'attainment';
let rawSortAsc = false;

// ── Raw data overrides (cached from Supabase)
let rawOverrides = {};

async function loadRawOverrides() {
  try {
    const res = await fetch(`${SB_RAW}?select=*`, { headers: SB_HDR });
    const data = await res.json();
    rawOverrides = {};
    if (Array.isArray(data)) data.forEach(r => { rawOverrides[r.row_key] = r; });
  } catch(e) { console.warn('loadRawOverrides failed:', e); }
}

async function saveRawOverride(rowKey, field, value) {
  const existing = rawOverrides[rowKey];
  try {
    if (existing) {
      await fetch(`${SB_RAW}?row_key=eq.${encodeURIComponent(rowKey)}`, {
        method: 'PATCH', headers: { ...SB_HDR, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ [field]: value, updated_at: new Date().toISOString() })
      });
      rawOverrides[rowKey] = { ...existing, [field]: value };
    } else {
      await fetch(SB_RAW, {
        method: 'POST', headers: { ...SB_HDR, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ row_key: rowKey, [field]: value, updated_at: new Date().toISOString() })
      });
      rawOverrides[rowKey] = { row_key: rowKey, [field]: value };
    }
  } catch(e) { console.warn('saveRawOverride failed:', e); }
}

function buildRawPanel() {
  const store = loadStore();

  Object.values(store).forEach(md => {

    md.rawRows.forEach(r => { allRows.push(r); allMonths.add(r.month); allPlans.add(r.plan); });
  });
  const monthOpts = ['All months', ...Array.from(allMonths).sort((a,b)=>{ const da=new Date(a),db=new Date(b); return (isNaN(da)?a:da.getTime())-(isNaN(db)?b:db.getTime()); })].map(m=>`<option value="${m}">${m}</option>`).join('');
  const planOpts  = ['All plans', ...Array.from(allPlans).sort()].map(p=>`<option value="${p}">${p}</option>`).join('');

  document.getElementById('raw-panel').innerHTML = `
    <div class="raw-filters">
      <label>Month</label><select class="raw-select" id="raw-month-filter">${monthOpts}</select>
      <label style="margin-left:8px">Plan</label><select class="raw-select" id="raw-plan-filter">${planOpts}</select>
      <input class="raw-search" id="raw-search" placeholder="Search by name…" type="text">
      <span class="raw-count" id="raw-count"></span>
      <span class="raw-saving" id="raw-saving">✓ Saved</span>
    </div>
    <div style="font-size:10px;font-family:var(--mono);color:var(--text3);padding:4px 0 10px">
      Click any OTE, Payout or Notes cell to edit — changes saved automatically
    </div>
    <div class="table-wrap">
      <table id="raw-table">
        <thead><tr>
          <th data-col="month">Month <span class="sort-icon">↕</span></th>
          <th data-col="plan">Plan <span class="sort-icon">↕</span></th>
          <th data-col="name">Name <span class="sort-icon">↕</span></th>
          <th data-col="area">Area ✎ <span class="sort-icon">↕</span></th>
          <th data-col="region">Region <span class="sort-icon">↕</span></th>
          <th data-col="level">Level <span class="sort-icon">↕</span></th>
          <th data-col="currency">CCY <span class="sort-icon">↕</span></th>
          <th data-col="ote_usd">OTE (USD) ✎ <span class="sort-icon">↕</span></th>
          <th data-col="payout_usd">Payout (USD) ✎ <span class="sort-icon">↕</span></th>
          <th data-col="attainment">Attainment <span class="sort-icon">↕</span></th>
          <th>Notes ✎</th>
        </tr></thead>
        <tbody id="raw-tbody"></tbody>
      </table>
    </div>`;

  document.querySelectorAll('#raw-table th[data-col]').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      if (rawSortCol === col) rawSortAsc = !rawSortAsc; else { rawSortCol = col; rawSortAsc = true; }
      document.querySelectorAll('#raw-table th').forEach(t => t.classList.remove('sorted'));
      th.classList.add('sorted');
      const si = th.querySelector('.sort-icon'); if (si) si.textContent = rawSortAsc ? '↑' : '↓';
      renderRawRows();
    };
  });
  document.getElementById('raw-month-filter').onchange = renderRawRows;
  document.getElementById('raw-plan-filter').onchange  = renderRawRows;
  document.getElementById('raw-search').oninput = renderRawRows;
  document.getElementById('raw-table').__rows = allRows;
  loadRawOverrides().then(() => renderRawRows());
}

function makeEditableCell(rowKey, field, display, rawVal) {
  return `<td class="editable" data-key="${rowKey}" data-field="${field}" data-raw="${String(rawVal).replace(/"/g,'&quot;')}" onclick="startEditCell(this)">${display}</td>`;
}

function startEditCell(td) {
  if (td.querySelector('input')) return;
  const input = document.createElement('input');
  input.value = td.dataset.raw;
  input.onclick = e => e.stopPropagation();
  input.onblur = () => finishEditCell(td, input);
  input.onkeydown = e => { if (e.key==='Enter') input.blur(); if (e.key==='Escape') { input.value=td.dataset.raw; input.blur(); } };
  td.innerHTML = ''; td.appendChild(input); input.focus(); input.select();
}

async function finishEditCell(td, input) {
  const newVal = input.value.trim();
  const oldRaw = td.dataset.raw;
  const field  = td.dataset.field;
  const rowKey = td.dataset.key;

  const displayVal = v => {
    if (field === 'area')  return `<span style="color:var(--text2)">${v||'—'}</span>`;
    if (field === 'level') return `<span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${v||'—'}</span>`;
    if (field === 'notes') return v || '<span style="color:var(--text3);font-size:11px">add note…</span>';
    const n = parseFloat(v); return n ? `<span style="font-family:var(--mono)">$${Math.round(n).toLocaleString()}</span>` : '—';
  };

  if (newVal === oldRaw) { td.innerHTML = displayVal(oldRaw); return; }

  td.dataset.raw = newVal;
  td.innerHTML = displayVal(newVal);

  // Flash the cell green to confirm save
  td.style.transition = 'background 0.15s';
  td.style.background = 'rgba(26,122,74,0.12)';
  const savEl = document.getElementById('raw-saving');
  if (savEl) savEl.classList.add('show');

  await saveRawOverride(rowKey, field, newVal);

  setTimeout(() => { td.style.background = ''; savEl?.classList.remove('show'); }, 1600);

  // If area changed, update the adjacent region cell
  if (field === 'area') {
    const row = td.closest('tr');
    if (row) {
      const regionCell = row.querySelector('td:nth-child(5)');
      if (regionCell) regionCell.textContent = areaToRegion(newVal);
    }
  }
}

function renderRawRows() {
  const tbl = document.getElementById('raw-table');
  if (!tbl) return;
  let rows = tbl.__rows || [];
  const monthFilter = document.getElementById('raw-month-filter')?.value || 'All months';
  const planFilter  = document.getElementById('raw-plan-filter')?.value  || 'All plans';
  const search = (document.getElementById('raw-search')?.value || '').toLowerCase().trim();
  if (monthFilter !== 'All months') rows = rows.filter(r => r.month === monthFilter);
  if (planFilter  !== 'All plans')  rows = rows.filter(r => r.plan  === planFilter);
  if (search) rows = rows.filter(r => r.name.toLowerCase().includes(search) || r.area.toLowerCase().includes(search));
  rows = [...rows].sort((a,b) => {
    let va=a[rawSortCol], vb=b[rawSortCol];
    if (va==null) va=''; if (vb==null) vb='';
    const cmp = typeof va==='number'&&typeof vb==='number' ? va-vb : String(va).localeCompare(String(vb));
    return rawSortAsc ? cmp : -cmp;
  });
  document.getElementById('raw-count').textContent = `${rows.length} row${rows.length!==1?'s':''}`;
  const fmt$ = v => v==null?'—':'$'+Math.round(v).toLocaleString();
  const fmtAtt = v => {
    if (v==null||!isFinite(v)) return '<span class="att-cell" style="color:var(--text3)">—</span>';
    const pct=Math.round(v*1000)/10;
    return `<span class="att-cell ${pct>=100?'att-green':pct>=70?'att-amber':'att-red'}">${pct.toFixed(1)}%</span>`;
  };
  const planBadge = p => {
    const cls=p==='AE Plan'?'blue':p==='BDR Plan'?'green':p==='SDR Plan'?'amber':p==='AE Manager/Director'?'blue':'red';
    return `<span class="badge badge-${cls}">${p}</span>`;
  };
  const tbody = document.getElementById('raw-tbody');
  tbody.innerHTML = rows.map(r => {
    const rowKey = `${r.month}||${r.name}||${r.plan}`;
    const ov = rawOverrides[rowKey] || {};
    const ote    = ov.ote_usd    != null ? parseFloat(ov.ote_usd)    : r.ote_usd;
    const payout = ov.payout_usd != null ? parseFloat(ov.payout_usd) : r.payout_usd;
    const notes  = ov.notes ?? '';
    const area   = ov.area  ?? r.area  ?? '';
    const level  = ov.level ?? r.level ?? '';
    const att    = ote > 0 ? payout / ote : r.attainment;
    const region = areaToRegion(area);
    return `<tr>
      <td style="font-family:var(--mono);font-size:11px;color:var(--text3)">${r.month}</td>
      <td>${planBadge(r.plan)}</td>
      <td style="font-weight:500">${r.name}</td>
      ${makeEditableCell(rowKey,'area', `<span style="color:var(--text2)">${area||'—'}</span>`, area)}
      <td style="color:var(--text3);font-size:11px;font-family:var(--mono)">${region}</td>
      ${makeEditableCell(rowKey,'level', `<span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${level||'—'}</span>`, level)}
      <td><span class="badge badge-blue">${r.currency}</span></td>
      ${makeEditableCell(rowKey,'ote_usd', fmt$(ote), ote)}
      ${makeEditableCell(rowKey,'payout_usd', fmt$(payout), payout)}
      <td style="text-align:right">${fmtAtt(att)}</td>
      ${makeEditableCell(rowKey,'notes', notes||'<span style="color:var(--text3);font-size:11px">add note…</span>', notes)}
    </tr>`;
  }).join('');
}

// QUARTERLY ENGINE

const QTR_HEX = { Q1:'#1d6fce', Q2:'#1a7a4a', Q3:'#b45309', Q4:'#7c3aed' };
function qHex(q) { const m=q.match(/Q(\d)/); return m?QTR_HEX['Q'+m[1]]||'#888':'#888'; }
function qRgba(q,a=0.78){ const h=qHex(q); const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

// Aggregate all stored months → { 'Q2 2026': [ {name,area,level,ote,payout,comp,months}, … ] }
function buildQtrData(plan) {
  const store = loadStore();
  const acc = {};
  Object.entries(store).forEach(([monthLabel, md]) => {
    if (!md.plans?.[plan]) return;
    md.plans[plan].forEach(p => {
      const rowKey = `${monthLabel}||${p.name}||${plan}`;
      const ov = rawOverrides[rowKey] || {};
      // Apply overrides for area and level
      const effectiveArea  = ov.area  ?? p.area;
      const effectiveLevel = ov.level ?? p.level;
      const effectiveOTE   = ov.ote_usd    != null ? parseFloat(ov.ote_usd)    : p.ote;
      const effectivePay   = ov.payout_usd != null ? parseFloat(ov.payout_usd) : p.payout;
      const q = p.quarter || 'Unknown';
      if (!acc[q]) acc[q] = {};
      if (!acc[q][p.name]) acc[q][p.name] = {
        name:p.name, area:effectiveArea, level:effectiveLevel, ote:0, payout:0, months:0,
        comp:{ mrr_actual:0,mrr_quota:0,addons_actual:0,addons_quota:0,
               dp_actual:0,dp_target:0,closing_usd:0,
               qp_payout:0,qp_target:0,
               bdr_qp_ach:0,bdr_qp_tgt:0,bdr_cl_ach:0,bdr_cl_tgt:0 }
      };
      const a = acc[q][p.name];
      // Always update area/level to latest override
      a.area = effectiveArea; a.level = effectiveLevel;
      a.ote += effectiveOTE; a.payout += effectivePay; a.months++;
      Object.keys(a.comp).forEach(k => { if (p.comp[k]!==undefined) a.comp[k] += p.comp[k]; });
    });
  });
  const result = {};
  Object.entries(acc).forEach(([q,people]) => { result[q] = Object.values(people).sort((a,b)=>a.name.localeCompare(b.name)); });
  return result;
}

function qtrAtt(person, plan, subId) {
  const c = person.comp;
  if (subId==='overall') return person.ote>0?(person.payout/person.ote)*100:null;
  if (subId==='mrr')     return c.mrr_quota>0?(c.mrr_actual/c.mrr_quota)*100:null;
  if (subId==='addons')  return c.addons_quota>0?(c.addons_actual/c.addons_quota)*100:null;
  if (subId==='dp')      return c.dp_target>0?(c.dp_actual/c.dp_target)*100:null;
  if (subId==='closing') return c.closing_usd!=null?c.closing_usd:null;
  if (subId==='qp')      return c.qp_target>0?(c.qp_payout/c.qp_target)*100:null;
  if (subId==='bdrqp')   return c.bdr_qp_tgt>0?(c.bdr_qp_ach/c.bdr_qp_tgt)*100:null;
  if (subId==='bdrcl')   return c.bdr_cl_tgt>0?(c.bdr_cl_ach/c.bdr_cl_tgt)*100:null;
  return null;
}

// Grouped bar: IC attainment across selected quarters
// ── REGION MAPPING ──────────────────────────────────
const REGION_MAP = {
  // EMEA
  'fime':'EMEA','uki':'EMEA','dach':'EMEA','iberia':'EMEA',
  'iberia & latam':'EMEA','dach & benelux & nordics':'EMEA',
  'dach & benelux':'EMEA','benelux':'EMEA','nordics':'EMEA',
  'london':'EMEA','emea':'EMEA','2026-ae manager/director':'EMEA',
  // NA
  'na-west':'NA','na-east':'NA','na west':'NA','na east':'NA',
  'na':'NA','latam':'NA','latam (na)':'NA',
  // APAC
  'anz':'APAC','apac':'APAC','australia':'APAC','new zealand':'APAC',
};
function areaToRegion(area) {
  return REGION_MAP[(area||'').toLowerCase().trim()] || 'Unknown';
}

function renderQtrICBar(canvasId, qtrData, selQtrs, plan, subId) {
  const wrap = document.getElementById(canvasId)?.closest('.chart-wrap');
  if (!wrap) return;
  destroyChart(canvasId);

  const isDollar = plan==='BDR Plan'&&subId==='closing';

  // Collect regions
  const regionSet = new Set(['All']);
  selQtrs.forEach(q=>(qtrData[q]||[]).forEach(p=>{
    const r = areaToRegion(p.area||'');
    if (r !== 'Unknown') regionSet.add(r);
  }));
  const regions = ['All', ...['EMEA','NA','APAC'].filter(r=>regionSet.has(r)),
    ...[...regionSet].filter(r=>!['All','EMEA','NA','APAC'].includes(r))];

  // Build matrix: name → { region, quarters: {q: val} }
  const allPeople = {};
  selQtrs.forEach(q=>{
    (qtrData[q]||[]).forEach(p=>{
      if (!allPeople[p.name]) allPeople[p.name] = { region: areaToRegion(p.area||''), quarters:{} };
      const v = qtrAtt(p, plan, subId);
      if (v!==null && isFinite(v)) allPeople[p.name].quarters[q] = Math.round(v*10)/10;
    });
  });

  function drawChart(regionFilter) {
    const filtered = Object.entries(allPeople)
      .filter(([,d]) => regionFilter==='All' || d.region===regionFilter)
      .sort(([,a],[,b]) => {
        const lastQ = selQtrs[selQtrs.length-1];
        const va = a.quarters[lastQ] ?? a.quarters[selQtrs.find(q=>a.quarters[q]!==undefined)] ?? -Infinity;
        const vb = b.quarters[lastQ] ?? b.quarters[selQtrs.find(q=>b.quarters[q]!==undefined)] ?? -Infinity;
        return vb - va;
      });

    const names = filtered.map(([n])=>n);
    const shortNames = names.map(n=>{ const p=n.split(' '); return p[0]+(p[1]?' '+p[1][0]+'.':''); });

    if (!names.length) {
      canvasEl.style.display='none';
      noDataEl.style.display='block';
      noDataEl.textContent = `No data for ${areaFilter}`;
      return;
    }
    noDataEl.style.display='none';
    canvasEl.style.display='block';

    const barH = Math.max(28, Math.floor(320 / Math.max(names.length, 1)));
    wrap.style.height = Math.max(300, names.length * barH * selQtrs.length * 0.55 + 60) + 'px';

    destroyChart(canvasId);
    const ctx = canvasEl.getContext('2d');
    const datasets = selQtrs.map(q=>({
      label: q,
      data: names.map(n => filtered.find(([name])=>name===n)?.[1].quarters[q] ?? null),
      backgroundColor: qRgba(q, 0.78),
      borderColor: qHex(q),
      borderWidth: 1, borderRadius: 3, borderSkipped: false
    }));

    charts[canvasId] = new Chart(ctx, {
      type:'bar',
      data:{ labels: shortNames, datasets },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:true, position:'top', labels:{ font:{family:"'IBM Plex Mono'",size:11}, boxWidth:12, padding:14 }},
          tooltip:{ ...TT, callbacks:{ label: c=>`${c.dataset.label}: ${c.raw!==null?(isDollar?'$'+Math.round(c.raw).toLocaleString():c.raw.toFixed(1)+'%'):'—'}` }}
        },
        scales:{
          x:{ grid:{color:GRID}, ticks:{...TICK, callback:v=>isDollar?'$'+Math.round(v/1000)+'k':v+'%'},
              ...(isDollar?{}:{min:0}) },
          y:{ grid:{display:false}, ticks:{color:'#5a574f', font:{family:"'IBM Plex Mono'",size:10}} }
        }
      }
    });
  }

  // Build area filter buttons + canvas
  let activeArea = regions[0];
  const btnBar = document.createElement('div');
  btnBar.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px';

  const canvasEl = document.createElement('canvas');
  canvasEl.id = canvasId;
  const noDataEl = document.createElement('p');
  noDataEl.style.cssText = 'padding:20px;color:#9c9890;font-family:var(--mono);font-size:12px;display:none';

  regions.forEach(region => {
    const btn = document.createElement('button');
    btn.textContent = region;
    btn.style.cssText = `padding:4px 12px;border-radius:20px;border:1px solid ${region===activeArea?'var(--blue)':'var(--border2)'};background:${region===activeArea?'var(--blue)':'var(--white)'};color:${region===activeArea?'white':'var(--text2)'};font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .15s`;
    btn.onclick = () => {
      activeArea = region;
      btnBar.querySelectorAll('button').forEach(b=>{
        b.style.background='var(--white)'; b.style.color='var(--text2)'; b.style.borderColor='var(--border2)';
      });
      btn.style.background='var(--blue)'; btn.style.color='white'; btn.style.borderColor='var(--blue)';
      drawChart(region);
    };
    btnBar.appendChild(btn);
  });

  wrap.style.height = 'auto';
  wrap.innerHTML = '';
  wrap.appendChild(btnBar);
  wrap.appendChild(canvasEl);
  wrap.appendChild(noDataEl);

  drawChart(activeArea);
}

function renderQtrDimBar(canvasId, qtrData, selQtrs, plan, subId, dimKey) {

// Build and render the full quarterly view for a plan
function renderQuarterlyView(idx, plan) {
  const container = document.getElementById(`qtr-content-${idx}`);
  if (!container) return;
  const qtrData = buildQtrData(plan);
  const allQtrs = Object.keys(qtrData).sort();
  if (!allQtrs.length) {
    container.innerHTML='<div class="qtr-no-data">No quarterly data — load monthly CSVs from at least one quarter</div>';
    return;
  }

  const compTabs = subTabsForPlan(plan);

  // Quarter filter chips HTML — use qcN class for CSS color
  const chipsHTML = allQtrs.map(q=>{
    const m = q.match(/Q(\d)/);
    const qn = m ? parseInt(m[1]) : 0;
    const cls = qn >= 1 && qn <= 4 ? ` qc${qn}` : '';
    return `<span class="qtr-chip active${cls}" data-qval="${q}">${q}</span>`;
  }).join('');

  // Scatter quarter tabs + panels
  const scatterTabsHTML = allQtrs.map((q,i)=>
    `<button class="qtr-comp-tab${i===0?' active':''}" data-qscatter="${q}">${q}</button>`).join('');
  const scatterPanelsHTML = allQtrs.map((q,i)=>{
    const sid = `qscatter-${idx}-${q.replace(/\s/g,'_')}`;
    return `<div class="qtr-comp-panel${i===0?' active':''}" id="${sid}">
      <div class="legend-row" style="margin-bottom:8px">
        <div class="leg"><div class="leg-dot" style="background:#1a7a4a"></div>Above OTE</div>
        <div class="leg"><div class="leg-dot" style="background:#c0392b"></div>Below OTE</div>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="qsc-${idx}-${q.replace(/\s/g,'_')}"></canvas></div>
    </div>`;
  }).join('');

  // Component attainment tabs + panels
  const attTabsHTML = compTabs.map((t,i)=>
    `<button class="qtr-comp-tab${i===0?' active':''}" data-qcomp="${t.id}">${t.label}</button>`).join('');
  const attPanelsHTML = compTabs.map((t,i)=>`
    <div class="qtr-comp-panel${i===0?' active':''}" id="qattp-${idx}-${t.id}">
      <div class="qtr-section">
        <div class="section-title" id="qtric-title-${idx}-${t.id}">Quarterly Attainment — by IC</div>
        <div class="chart-wrap" style="height:340px"><canvas id="qc-ic-${idx}-${t.id}"></canvas></div>
      </div>
      <div class="qtr-two-col">
        <div class="qtr-section">
          <div class="section-title" id="qtrarea-title-${idx}-${t.id}">By Region</div>
          <div class="chart-wrap" style="height:260px"><canvas id="qc-area-${idx}-${t.id}"></canvas></div>
        </div>
        <div class="qtr-section">
          <div class="section-title" id="qtrrawarea-title-${idx}-${t.id}">By Area</div>
          <div class="chart-wrap" style="height:260px"><canvas id="qc-rawarea-${idx}-${t.id}"></canvas></div>
        </div>
        <div class="qtr-section">
          <div class="section-title" id="qtrlevel-title-${idx}-${t.id}">By Level</div>
          <div class="chart-wrap" style="height:260px"><canvas id="qc-level-${idx}-${t.id}"></canvas></div>
        </div>
      </div>
    </div>`).join('');

  container.innerHTML = `
    <div class="qtr-section" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="section-title" style="margin-bottom:0">Show quarters:</span>
        <div id="qtr-chips-${idx}" style="display:flex;gap:6px;flex-wrap:wrap">${chipsHTML}</div>
        <span id="qtr-sel-hint-${idx}" style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:4px"></span>
      </div>
    </div>

    <div class="qtr-section" style="margin-bottom:16px">
      <div class="section-title" style="margin-bottom:10px">OTE vs Quarterly Payout — by Quarter</div>
      <div class="qtr-comp-tabs" id="qscatter-tabs-${idx}">${scatterTabsHTML}</div>
      ${scatterPanelsHTML}
    </div>

    <div class="qtr-section">
      <div class="section-title" style="margin-bottom:10px">Quarterly Attainment — by Component</div>
      <div class="qtr-comp-tabs" id="qatt-tabs-${idx}">${attTabsHTML}</div>
      ${attPanelsHTML}
    </div>`;

  // Store state
  container.__qtrData = qtrData;
  container.__allQtrs = allQtrs;
  container.__selQtrs = [...allQtrs];
  container.__activeComp = compTabs[0].id;

  // Wire scatter quarter tabs
  container.querySelectorAll(`#qscatter-tabs-${idx} .qtr-comp-tab`).forEach(btn=>{
    btn.onclick = ()=>{
      container.querySelectorAll(`#qscatter-tabs-${idx} .qtr-comp-tab`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const q = btn.dataset.qscatter;
      container.querySelectorAll(`[id^="qscatter-${idx}-"]`).forEach(p=>p.classList.remove('active'));
      document.getElementById(`qscatter-${idx}-${q.replace(/\s/g,'_')}`)?.classList.add('active');
      renderQtrScatter(`qsc-${idx}-${q.replace(/\s/g,'_')}`, qtrData[q]||[]);
    };
  });

  // Wire attainment component tabs
  container.querySelectorAll(`#qatt-tabs-${idx} .qtr-comp-tab`).forEach(btn=>{
    btn.onclick = ()=>{
      container.querySelectorAll(`#qatt-tabs-${idx} .qtr-comp-tab`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const comp = btn.dataset.qcomp;
      container.querySelectorAll(`[id^="qattp-${idx}-"]`).forEach(p=>p.classList.remove('active'));
      document.getElementById(`qattp-${idx}-${comp}`)?.classList.add('active');
      container.__activeComp = comp;
      renderQtrCharts(idx, plan, container.__qtrData, container.__selQtrs, comp);
    };
  });

  // Wire quarter filter chips
  container.querySelectorAll(`#qtr-chips-${idx} .qtr-chip`).forEach(chip=>{
    chip.onclick = ()=>{
      chip.classList.toggle('active');
      let sel = Array.from(container.querySelectorAll(`#qtr-chips-${idx} .qtr-chip.active`)).map(c=>c.dataset.qval);
      if (!sel.length) {
        container.querySelectorAll(`#qtr-chips-${idx} .qtr-chip`).forEach(c=>c.classList.add('active'));
        sel = [...allQtrs];
      }
      container.__selQtrs = sel;
      renderQtrCharts(idx, plan, container.__qtrData, sel, container.__activeComp);
    };
  });

  // Initial renders
  const firstQ = allQtrs[0];
  renderQtrScatter(`qsc-${idx}-${firstQ.replace(/\s/g,'_')}`, qtrData[firstQ]||[]);
  renderQtrCharts(idx, plan, qtrData, allQtrs, compTabs[0].id);
}

// ═══════════════════════════════════════════════════
// YTD ENGINE
// ═══════════════════════════════════════════════════

function buildYTDData(plan) {
  const store = loadStore();
  const acc = {}; // name → accumulated person

  Object.entries(store).forEach(([monthLabel, md]) => {
    if (!md.plans?.[plan]) return;
    // Only include months from the current year (year of latest stored month)
    const d = new Date(monthLabel);
    if (isNaN(d)) return;
    const years = Object.keys(store).map(m => new Date(m).getFullYear()).filter(y => !isNaN(y));
    const currentYear = Math.max(...years);
    if (d.getFullYear() !== currentYear) return;

    md.plans[plan].forEach(p => {
      const rowKey = `${monthLabel}||${p.name}||${plan}`;
      const ov = rawOverrides[rowKey] || {};
      const effArea  = ov.area   ?? p.area;
      const effLevel = ov.level  ?? p.level;
      const effOTE   = ov.ote_usd    != null ? parseFloat(ov.ote_usd)    : p.ote;
      const effPay   = ov.payout_usd != null ? parseFloat(ov.payout_usd) : p.payout;

      if (!acc[p.name]) {
        acc[p.name] = {
          name: p.name, area: effArea, level: effLevel,
          ote: 0, payout: 0, months: 0,
          comp: { mrr_actual:0, mrr_quota:0, addons_actual:0, addons_quota:0,
                  dp_actual:0, dp_target:0, closing_usd:0,
                  qp_payout:0, qp_target:0,
                  bdr_qp_ach:0, bdr_qp_tgt:0, bdr_cl_ach:0, bdr_cl_tgt:0 }
        };
      }
      const a = acc[p.name];
      a.area = effArea; a.level = effLevel; // keep latest
      a.ote    += effOTE;
      a.payout += effPay;
      a.months++;
      Object.keys(a.comp).forEach(k => { if (p.comp[k] !== undefined) a.comp[k] += p.comp[k]; });
    });
  });
  return Object.values(acc).sort((a,b) => a.name.localeCompare(b.name));
}

function ytdAtt(person, plan, subId) {
  const c = person.comp;
  if (subId==='overall')  return person.ote>0 ? (person.payout/person.ote)*100 : null;
  if (subId==='mrr')      return c.mrr_quota>0    ? (c.mrr_actual/c.mrr_quota)*100       : null;
  if (subId==='addons')   return c.addons_quota>0  ? (c.addons_actual/c.addons_quota)*100  : null;
  if (subId==='dp')       return c.dp_target>0     ? (c.dp_actual/c.dp_target)*100         : null;
  if (subId==='closing')  return c.closing_usd != null ? c.closing_usd : null;
  if (subId==='qp')       return c.qp_target>0     ? (c.qp_payout/c.qp_target)*100        : null;
  if (subId==='bdrqp')    return c.bdr_qp_tgt>0    ? (c.bdr_qp_ach/c.bdr_qp_tgt)*100      : null;
  if (subId==='bdrcl')    return c.bdr_cl_tgt>0    ? (c.bdr_cl_ach/c.bdr_cl_tgt)*100      : null;
  return null;
}

function renderYTDScatter(canvasId, people) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  const valid = people.filter(p => p.ote > 0);
  if (!valid.length) return;
  const maxV = Math.max(...valid.map(p => Math.max(p.ote, p.payout)), 1) * 1.15;
  charts[canvasId] = new Chart(ctx, {
    type: 'scatter',
    data: { datasets: [
      { data: valid.map(p => ({x:p.ote, y:p.payout, name:p.name})),
        backgroundColor: valid.map(p => p.payout>=p.ote ? 'rgba(26,122,74,0.75)' : 'rgba(192,57,43,0.75)'),
        borderColor:     valid.map(p => p.payout>=p.ote ? '#1a7a4a' : '#c0392b'),
        borderWidth:1.5, pointRadius:6, pointHoverRadius:8 },
      { data:[{x:0,y:0},{x:maxV,y:maxV}], type:'line',
        borderColor:'rgba(29,111,206,0.35)', borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false }
    ]},
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{...TT, callbacks:{ label: c => { const d=c.raw; if(!d.name) return ''; return `${d.name}  OTE $${Math.round(d.x).toLocaleString()}  Payout $${Math.round(d.y).toLocaleString()}`; }}}},
      scales:{
        x:{ min:0, max:maxV, grid:{color:GRID}, ticks:{...TICK, callback:v=>'$'+Math.round(v/1000)+'k'}, title:{display:true, text:'YTD OTE (USD)', color:'#9c9890', font:{size:10}} },
        y:{ min:0, max:maxV, grid:{color:GRID}, ticks:{...TICK, callback:v=>'$'+Math.round(v/1000)+'k'}, title:{display:true, text:'YTD Payout (USD)', color:'#9c9890', font:{size:10}} }
      }
    }
  });
}

function renderYTDBar(canvasId, labels, values, isDollar) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  const wrap = document.getElementById(canvasId)?.closest('.chart-wrap');
  if (wrap) wrap.style.height = Math.max(280, labels.length * 26) + 'px';
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets:[{
      data: values,
      backgroundColor: values.map(v => isDollar ? 'rgba(29,111,206,0.7)' : v>=100?'rgba(26,122,74,0.7)':v>=70?'rgba(29,111,206,0.65)':'rgba(192,57,43,0.65)'),
      borderRadius:3, borderSkipped:false
    }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{...TT, callbacks:{ label: c => isDollar ? ` $${Math.round(c.raw).toLocaleString()}` : ` ${c.raw.toFixed(1)}%` }}},
      scales:{
        x:{ grid:{color:GRID}, ticks:{...TICK, callback:v=>isDollar?'$'+Math.round(v/1000)+'k':v+'%'} },
        y:{ grid:{display:false}, ticks:{...TICK} }
      }
    }
  });
}

function renderYTDGroupBar(canvasId, labels, values, colors) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  charts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[
      { data:values, backgroundColor:colors, borderRadius:4, borderSkipped:false },
      { type:'line', data:labels.map(()=>100), borderColor:'rgba(0,0,0,0.18)', borderDash:[5,4], borderWidth:1.5, pointRadius:0, fill:false }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{...TT, callbacks:{ label:c=>` ${c.raw.toFixed(1)}%` }}},
      scales:{ x:{grid:{display:false}, ticks:{color:'#5a574f',font:{size:11}}}, y:{grid:{color:GRID}, ticks:{...TICK, callback:v=>v+'%'}} }
    }
  });
}

function renderYTDCompPanel(idx, plan, people, subId, levelFilter) {
  const isDollar = plan==='BDR Plan' && subId==='closing';
  const PALETTE = ['#1d6fce','#e84e1b','#1a7a4a','#b45309','#7c3aed','#0891b2','#be123c','#15803d'];
  const col = i => PALETTE[i % PALETTE.length];

  // Apply level filter if set
  const filtered = levelFilter && levelFilter !== 'All'
    ? people.filter(p => p.level === levelFilter)
    : people;

  const attFn = p => ytdAtt(p, plan, subId);

  // by IC
  const sorted = [...filtered].map(p=>({...p, att:attFn(p)}))
    .filter(p => p.att !== null && isFinite(p.att))
    .sort((a,b) => b.att - a.att);
  const icLabels = sorted.map(p => { const pts=p.name.split(' '); return pts[0]+(pts[1]?' '+pts[1][0]+'.':''); });
  const icVals = sorted.map(p => isDollar ? Math.round(p.att) : Math.round(p.att*10)/10);
  renderYTDBar(`ytd_ic_${idx}_${subId}`, icLabels, icVals, isDollar);

  // by Region
  const regMap = {};
  filtered.forEach(p => {
    const r = areaToRegion(p.area||'Unknown');
    const v = attFn(p);
    if (v!==null && isFinite(v)) { if(!regMap[r]) regMap[r]={s:0,n:0}; regMap[r].s+=v; regMap[r].n++; }
  });
  const regKeys = Object.keys(regMap).sort();
  if (!isDollar) {
    renderYTDGroupBar(`ytd_reg_${idx}_${subId}`, regKeys,
      regKeys.map(r => Math.round(regMap[r].s/regMap[r].n*10)/10),
      regKeys.map((_,i) => col(i)+'bb'));
  } else {
    const vals = regKeys.map(r => Math.round(regMap[r].s/regMap[r].n));
    renderYTDBar(`ytd_reg_${idx}_${subId}`, regKeys, vals, true);
  }

  // by Area
  const areaMap = {};
  filtered.forEach(p => {
    const a = p.area||'Unknown';
    const v = attFn(p);
    if (v!==null && isFinite(v)) { if(!areaMap[a]) areaMap[a]={s:0,n:0}; areaMap[a].s+=v; areaMap[a].n++; }
  });
  const areaKeys = Object.keys(areaMap).sort();
  if (!isDollar) {
    renderYTDGroupBar(`ytd_area_${idx}_${subId}`, areaKeys,
      areaKeys.map(a => Math.round(areaMap[a].s/areaMap[a].n*10)/10),
      areaKeys.map((_,i) => col(i+2)+'bb'));
  } else {
    renderYTDBar(`ytd_area_${idx}_${subId}`, areaKeys, areaKeys.map(a=>Math.round(areaMap[a].s/areaMap[a].n)), true);
  }

  // by Level (with filter chips in container — chart only here)
  const lvlMap = {};
  people.forEach(p => { // always use unfiltered people for level chart
    const l = p.level||'Unknown';
    const v = attFn(p);
    if (v!==null && isFinite(v)) { if(!lvlMap[l]) lvlMap[l]={s:0,n:0}; lvlMap[l].s+=v; lvlMap[l].n++; }
  });
  const lvlKeys = Object.keys(lvlMap).sort();
  if (!isDollar) {
    renderYTDGroupBar(`ytd_lvl_${idx}_${subId}`, lvlKeys,
      lvlKeys.map(l => Math.round(lvlMap[l].s/lvlMap[l].n*10)/10),
      lvlKeys.map((_,i) => col(i+4)+'bb'));
  } else {
    renderYTDBar(`ytd_lvl_${idx}_${subId}`, lvlKeys, lvlKeys.map(l=>Math.round(lvlMap[l].s/lvlMap[l].n)), true);
  }
}

function renderYTDView(idx, plan) {
  const container = document.getElementById(`ytd-content-${idx}`);
  if (!container) return;
  const people = buildYTDData(plan);
  if (!people.length) { container.innerHTML='<div class="ytd-no-data">No data available</div>'; return; }

  const compTabs = subTabsForPlan(plan);
  const isDollar0 = plan==='BDR Plan';

  // Level filter options (unique levels across all people)
  const levels = ['All', ...Array.from(new Set(people.map(p=>p.level).filter(l=>l&&l!=='Unknown'))).sort()];
  const levelChipsHTML = levels.map(l =>
    `<span class="ytd-chip${l==='All'?' active':''}" data-ytdlevel="${l}">${l}</span>`
  ).join('');

  const compTabsHTML = compTabs.map((t,i) =>
    `<button class="ytd-comp-tab${i===0?' active':''}" data-ytdcomp="${t.id}">${t.label}</button>`
  ).join('');

  const compPanelsHTML = compTabs.map((t,i) => {
    const regions = Array.from(new Set(people.map(p=>areaToRegion(p.area||'Unknown')).filter(r=>r!=='Unknown'))).sort();
    const areas   = Array.from(new Set(people.map(p=>p.area||'Unknown').filter(a=>a!=='Unknown'))).sort();
    const regOpts  = `<option value="All">All regions</option>${regions.map(r=>`<option value="${r}">${r}</option>`).join('')}`;
    const areaOpts = `<option value="All">All areas</option>${areas.map(a=>`<option value="${a}">${a}</option>`).join('')}`;
    return `
    <div class="ytd-comp-panel${i===0?' active':''}" id="ytdp_${idx}_${t.id}">
      <div class="ytd-section" style="margin-bottom:16px">
        <div class="section-title">YTD Attainment — by IC</div>
        <div class="chart-wrap" style="height:300px"><canvas id="ytd_ic_${idx}_${t.id}"></canvas></div>
      </div>
      <div class="ytd-grid-2">
        <div class="ytd-section">
          <div class="section-title">By Region</div>
          <div class="chart-wrap" style="height:220px"><canvas id="ytd_reg_${idx}_${t.id}"></canvas></div>
        </div>
        <div class="ytd-section">
          <div class="section-title">By Area</div>
          <div class="chart-wrap" style="height:220px"><canvas id="ytd_area_${idx}_${t.id}"></canvas></div>
        </div>
      </div>
      <div class="ytd-section ytd-level-section">
        <div class="section-title">By Level</div>
        <div class="ytd-level-filters" id="ytd-lvl-filter-${idx}-${t.id}">
          <label>Filter by region:</label>
          <select class="ytd-sel-region" data-ytdidx="${idx}" data-ytdcomp="${t.id}">
            ${regOpts}
          </select>
          <span class="sep">— or —</span>
          <label>by area:</label>
          <select class="ytd-sel-area" data-ytdidx="${idx}" data-ytdcomp="${t.id}">
            ${areaOpts}
          </select>
        </div>
        <div class="chart-wrap" style="height:240px"><canvas id="ytd_lvl_${idx}_${t.id}"></canvas></div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="ytd-section" style="margin-bottom:16px">
      <div class="section-title">YTD OTE vs Payout — by IC (USD)</div>
      <div class="legend-row">
        <div class="leg"><div class="leg-dot" style="background:#1a7a4a"></div>Above OTE</div>
        <div class="leg"><div class="leg-dot" style="background:#c0392b"></div>Below OTE</div>
        <div class="leg"><div class="leg-dashed"></div>OTE line (y=x)</div>
      </div>
      <div class="chart-wrap h300"><canvas id="ytd_scatter_${idx}"></canvas></div>
    </div>
    <div class="ytd-section">
      <div class="section-title" style="margin-bottom:10px">YTD Attainment — by Component</div>
      <div class="ytd-comp-tabs" id="ytd-comp-tabs-${idx}">${compTabsHTML}</div>
      ${compPanelsHTML}
    </div>`;

  container.__people  = people;
  container.__plan    = plan;
  container.__subId   = compTabs[0].id;
  container.__lvlFilter = 'All';

  // Wire component tabs
  container.querySelectorAll(`#ytd-comp-tabs-${idx} .ytd-comp-tab`).forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll(`#ytd-comp-tabs-${idx} .ytd-comp-tab`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const subId = btn.dataset.ytdcomp;
      container.querySelectorAll(`[id^="ytdp_${idx}_"]`).forEach(p=>p.classList.remove('active'));
      document.getElementById(`ytdp_${idx}_${subId}`)?.classList.add('active');
      container.__subId = subId;
      renderYTDCompPanel(idx, plan, container.__people, subId, container.__lvlFilter);
    };
  });

  // Wire level filter dropdowns — region and area are mutually exclusive
  compTabs.forEach(t => {
    const filterBar = document.getElementById(`ytd-lvl-filter-${idx}-${t.id}`);
    if (!filterBar) return;

    const selReg  = filterBar.querySelector('.ytd-sel-region');
    const selArea = filterBar.querySelector('.ytd-sel-area');

    selReg.onchange = () => {
      // Reset area dropdown when region is selected
      if (selReg.value !== 'All') selArea.value = 'All';
      const fp = selReg.value === 'All'
        ? container.__people
        : container.__people.filter(p => areaToRegion(p.area||'Unknown') === selReg.value);
      redrawLevelChart(idx, plan, fp, t.id);
    };

    selArea.onchange = () => {
      // Reset region dropdown when area is selected
      if (selArea.value !== 'All') selReg.value = 'All';
      const fp = selArea.value === 'All'
        ? container.__people
        : container.__people.filter(p => p.area === selArea.value);
      redrawLevelChart(idx, plan, fp, t.id);
    };
  });

  // Initial render
  renderYTDScatter(`ytd_scatter_${idx}`, people);
  renderYTDCompPanel(idx, plan, people, compTabs[0].id, 'All');
}

function redrawLevelChart(idx, plan, filteredPeople, subId) {
  const isDollar = plan==='BDR Plan' && subId==='closing';
  const PALETTE = ['#1d6fce','#e84e1b','#1a7a4a','#b45309','#7c3aed','#0891b2'];
  const col = i => PALETTE[i%PALETTE.length];
  const attFn = p => ytdAtt(p, plan, subId);
  const lvlMap = {};
  filteredPeople.forEach(p => {
    const l = p.level||'Unknown';
    const v = attFn(p);
    if (v!==null && isFinite(v)) { if(!lvlMap[l]) lvlMap[l]={s:0,n:0}; lvlMap[l].s+=v; lvlMap[l].n++; }
  });
  const lvlKeys = Object.keys(lvlMap).sort();
  if (!isDollar) {

// Store current month/plan context per idx (set by initCommentBox)
const commentContext = {};

async function generateAnalysis(idx) {
  const ctx = commentContext[idx];
  if (!ctx) return;
  const { month, plan, people } = ctx;

  const btn    = document.getElementById(`comment-gen-${idx}`);
  const ta     = document.getElementById(`comment-ta-${idx}`);
  const status = document.getElementById(`comment-status-${idx}`);
  if (!btn || !ta) return;

  // Disable button + show status
  btn.disabled = true;
  btn.textContent = '⏳ Analysing…';
  btn.style.opacity = '0.6';
  status.style.display = 'block';
  status.textContent = 'Preparing data…';

  try {
    // Build compact data summary for the prompt
    const peopleSummary = people.map(p => {
      const att = p.ote > 0 ? ((p.payout / p.ote) * 100).toFixed(1) : 'N/A';
      const region = areaToRegion(p.area || 'Unknown');
      return `${p.name} | ${region} | ${p.level} | OTE $${Math.round(p.ote).toLocaleString()} | Payout $${Math.round(p.payout).toLocaleString()} | Attainment ${att}%`;
    }).join('\n');

    // Compute summary stats
    const withOTE  = people.filter(p => p.ote > 0);
    const atts     = withOTE.map(p => (p.payout / p.ote) * 100);
    const avgAtt   = atts.length ? (atts.reduce((a,b)=>a+b,0)/atts.length).toFixed(1) : 'N/A';
    const above    = atts.filter(a=>a>=100).length;
    const below70  = atts.filter(a=>a<70).length;
    const totalPay = people.reduce((s,p)=>s+p.payout,0);

    const prompt = `You are a Revenue Operations analyst reviewing monthly commission data. Analyze the following compensation results and provide a concise, actionable commentary in English.

CONTEXT: ${plan} — ${month}
Total ICs: ${people.length} | Avg attainment: ${avgAtt}% | Above OTE: ${above} | Below 70%: ${below70} | Total payout: $${Math.round(totalPay).toLocaleString()}

INDIVIDUAL RESULTS (Name | Region | Level | OTE | Payout | Attainment):
${peopleSummary}

Please analyze and identify:
1. **Overall performance summary** — is the plan performing as expected?
2. **Overperformers** — individuals or groups (by region/level) with unusually high attainment (>130%). Could indicate quota too low or windfall deals.
3. **Underperformers** — individuals or groups below 70%. Persistent patterns that could indicate quota issues, ramp problems, or genuine underperformance.
4. **Payout anomalies** — cases where payout seems inconsistent with attainment (very high payout with low attainment, or vice versa).
5. **Regional/level patterns** — any region or level systematically over or underperforming that may suggest quota calibration issues.
6. **Action items** — 2-3 concrete recommendations.

Keep it concise (max 300 words), use bullet points, be direct. No fluff. Flag genuine anomalies only.`;

    status.textContent = 'Calling Claude API…';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) throw new Error(`API error ${response.status}`);
    const data = await response.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';

    if (!text) throw new Error('Empty response');

    // Pre-fill textarea — user can edit freely after
    ta.value = text;
    ta.dispatchEvent(new Event('input')); // trigger auto-save

    status.style.display = 'none';
    showToast('✓ Analysis generated — edit as needed');

  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    showToast('Analysis failed: ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '✦ Generate analysis';
    btn.style.opacity = '1';
  }
}

const SB_URL  = 'https://srsikuloqexocswedjgf.supabase.co/rest/v1/comments';
const SB_RAW  = 'https://srsikuloqexocswedjgf.supabase.co/rest/v1/raw_overrides';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyc2lrdWxvcWV4b2Nzd2VkamdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTI0ODcsImV4cCI6MjA5NjIyODQ4N30.Wu__nes4dyM_vMUr7rOFs4NFzVA3C9G1nd0PhhcOQ7I';
const SB_HDR  = { 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY };

async function sbLoadComment(month, plan) {
  try {
    const res = await fetch(`${SB_URL}?month=eq.${encodeURIComponent(month)}&plan=eq.${encodeURIComponent(plan)}&select=content`, { headers: SB_HDR });
    const data = await res.json();
    return data?.[0]?.content || '';
  } catch { return ''; }
}

async function sbSaveComment(month, plan, content) {
  const filter = `?month=eq.${encodeURIComponent(month)}&plan=eq.${encodeURIComponent(plan)}`;
  const body = JSON.stringify({ content, updated_at: new Date().toISOString() });
  try {
    // Always PATCH first — updates existing row
    const patch = await fetch(SB_URL + filter, {
      method: 'PATCH',
      headers: { ...SB_HDR, 'Prefer': 'return=minimal' },
      body
    });
    // If no row matched (0 rows updated), fall back to INSERT
    const count = patch.headers.get('content-range');
    if (patch.status === 200 && count === '*/0') {
      await fetch(SB_URL, {
        method: 'POST',
        headers: { ...SB_HDR, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ month, plan, content, updated_at: new Date().toISOString() })
      });
    }
  } catch(e) { console.warn('Supabase save failed:', e); }
}

// RENDER MONTH

let activeMonth = null;

function renderMonth(key) {
  activeMonth = key;
  const store = loadStore();
  const data = store[key];
  if (!data) return;

  document.getElementById('hdr-sub').textContent = `Monthly view: ${key}`;
  document.getElementById('fx-note').textContent = `FX (official CIQ): EUR×1.16 · GBP×1.33 · AUD×0.66 · MXN×0.05`;

  const tabsEl   = document.getElementById('plan-tabs');
  const panelsEl = document.getElementById('plan-panels');
  const rawEl    = document.getElementById('raw-panel');
  tabsEl.innerHTML = '';
  panelsEl.innerHTML = '';
  rawEl.innerHTML = '';
  rawEl.classList.remove('active');

  const planNames = Object.keys(data.plans);

  planNames.forEach((plan, idx) => {
    const btn = document.createElement('button');
    btn.className = 'plan-tab' + (idx===0?' active':'');
    btn.textContent = plan;
    btn.onclick = () => {
      tabsEl.querySelectorAll('.plan-tab').forEach(b=>b.classList.remove('active'));
      panelsEl.querySelectorAll('.plan-content').forEach(c=>c.classList.remove('active'));
      rawEl.classList.remove('active');
      btn.classList.add('active');
      const panel = document.getElementById(`plan_${idx}`);
      panel.classList.add('active');
      renderPlanKPIs(idx, data.plans[plan]);
      renderScatter(`scatter_${idx}`, data.plans[plan], key, plan);
      renderSubTab(idx, plan, data.plans[plan], 'overall');
      initCommentBox(idx, key, plan, data.plans[plan]);
    };
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'plan-content' + (idx===0?' active':'');
    panel.id = `plan_${idx}`;
    panel.innerHTML = buildPlanPanel(idx, plan);
    panel.__plan = plan;
    panelsEl.appendChild(panel);

    // Populate month chips inside this panel's Monthly view
    const store2 = loadStore();
    const allKeys = sortedKeys(store2, true);
    const mChipsEl = panel.querySelector(`#month-chips-${idx}`);
    if (mChipsEl) {
      allKeys.forEach(k => {
        const mc = document.createElement('span');
        mc.className = 'mchip' + (k===key?' active':'');
        const d2 = new Date(k);
        mc.textContent = isNaN(d2) ? k : d2.toLocaleString('en-US',{month:'short',year:'2-digit'});
        mc.title = k;
        mc.onclick = () => {
          panel.querySelectorAll(`#month-chips-${idx} .mchip`).forEach(c=>c.classList.remove('active'));
          mc.classList.add('active');
          // re-render monthly charts for this new month
          const newData = loadStore()[k];
          if (newData?.plans?.[plan]) {
            renderPlanKPIs(idx, newData.plans[plan]);
            renderScatter(`scatter_${idx}`, newData.plans[plan], k, plan);
            // re-render active sub-tab
            const activeSub = panel.querySelector('.sub-tab.active')?.dataset.sub || 'overall';
            renderSubTab(idx, plan, newData.plans[plan], activeSub);
            initCommentBox(idx, k, plan, newData.plans[plan]);
          }
        };
        mChipsEl.appendChild(mc);
      });
    }

    // Monthly sub-tab clicks
    panel.querySelectorAll('.sub-tab').forEach(st => {
      st.onclick = () => {
        const pIdx = parseInt(st.dataset.planIdx);
        const subId = st.dataset.sub;
        panel.querySelectorAll('.sub-tab').forEach(s=>s.classList.remove('active'));
        panel.querySelectorAll('.sub-panel').forEach(s=>s.classList.remove('active'));
        st.classList.add('active');
        document.getElementById(`sp_${pIdx}_${subId}`)?.classList.add('active');
        renderSubTab(pIdx, plan, data.plans[plan], subId);
      };

    // Monthly ↔ Quarterly toggle
    const vM  = document.getElementById(`vbtn-monthly-${idx}`);
    const vQ  = document.getElementById(`vbtn-quarterly-${idx}`);
    const vYTD= document.getElementById(`vbtn-ytd-${idx}`);

    const qV  = document.getElementById(`quarterly-view-${idx}`);
    const yV  = document.getElementById(`ytd-view-${idx}`);

  });

  // Raw Data tab
  const rawBtn = document.createElement('button');
  rawBtn.className = 'plan-tab rawdata-tab';
  rawBtn.textContent = '⊞ Raw Data';
  rawBtn.onclick = () => {
    tabsEl.querySelectorAll('.plan-tab').forEach(b=>b.classList.remove('active'));

    rawBtn.classList.add('active');
    rawEl.classList.add('active');
    buildRawPanel();
  };
  tabsEl.appendChild(rawBtn);

  if (planNames.length > 0) {
    renderPlanKPIs(0, data.plans[planNames[0]]);
    renderScatter('scatter_0', data.plans[planNames[0]], key, planNames[0]);
    renderSubTab(0, planNames[0], data.plans[planNames[0]], 'overall');
    initCommentBox(0, key, planNames[0], data.plans[planNames[0]]);
  }
}

// MONTH CHIPS — stored-months zone only (header)
// Active month selector lives inside each plan panel
// ═══════════════════════════════════════════════════
function refreshChips() {
  const store = loadStore();
  const keys = sortedKeys(store, true);
  const storedEl = document.getElementById('stored-months');
  storedEl.innerHTML = '';

  if (!keys.length) {
    storedEl.innerHTML = '<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">No months stored</span>';
    return;
  }

  keys.forEach(k => {
    const chip = document.createElement('span');
    chip.className = 'month-chip';
    chip.style.cursor = 'default';
    const d = new Date(k);
    chip.textContent = isNaN(d) ? k : d.toLocaleString('en-US',{month:'short',year:'2-digit'});
    chip.title = k;
    storedEl.appendChild(chip);

    const del = document.createElement('span');
    del.className = 'month-chip del';
    del.textContent = '×';
    del.title = 'Delete ' + k;
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Delete ${k}?`)) return;
      if (_store) delete _store[k];
      await deleteMonthFromSupabase(k);
      if (activeMonth === k) {
        activeMonth = null;
        document.getElementById('plan-tabs').innerHTML = '';
        document.getElementById('plan-panels').innerHTML = '';
        document.getElementById('raw-panel').innerHTML = '';
        document.getElementById('raw-panel').classList.remove('active');
        document.getElementById('hdr-sub').textContent = 'No data — upload a CaptivateIQ CSV to begin';
        document.getElementById('fx-note').textContent = '';
      }
      refreshChips();
      const rem = sortedKeys(loadStore(), false);
      if (rem.length) renderMonth(rem[0]);
      showToast(`${k} deleted`);
    };
    storedEl.appendChild(del);
  });

  if (!activeMonth && keys.length) { activeMonth = keys[keys.length-1]; refreshChips(); renderMonth(keys[keys.length-1]); }
}

// ═══════════════════════════════════════════════════
// FILE UPLOAD
// ═══════════════════════════════════════════════════
function handleFile(file) {
  if (!file?.name.endsWith('.csv')) { showToast('Please upload a .csv file', true); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const { monthLabel, plans, rawRows } = parseCSV(e.target.result);
      const monthData = { plans, rawRows, ts: Date.now() };
      // Update in-memory store
      if (!_store) _store = {};
      _store[monthLabel] = monthData;
      // Save to Supabase
      showToast(`⏳ Saving ${monthLabel} to Supabase…`);
      await saveMonthToSupabase(monthLabel, monthData);
      activeMonth = monthLabel;
      refreshChips();
      renderMonth(monthLabel);
      showToast(`✓ ${monthLabel} saved — ${Object.keys(plans).length} plans, ${rawRows.length} rows`);
    } catch(err) { showToast('Error: ' + err.message, true); }
  };
  reader.readAsText(file);
}

const uz = document.getElementById('upload-zone');
const fi = document.getElementById('file-input');
uz.onclick = () => fi.click();
fi.onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); fi.value=''; };
uz.ondragover = e => { e.preventDefault(); uz.classList.add('over'); };
uz.ondragleave = () => uz.classList.remove('over');
uz.ondrop = e => { e.preventDefault(); uz.classList.remove('over'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

// TOAST
// ═══════════════════════════════════════════════════
let toastT;
function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show'+(err?' err':'');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 3500);
}
